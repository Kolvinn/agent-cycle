[project]
name = "langchain-claude-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk>=0.2.153",
    "jsonschema>=4.26",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "networkx>=3.6.1",
    "pydantic>=2.13",
    "textual>=8.2.8",
]

[project.scripts]
langchain-claude-test = "langchain_claude_test.app:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "textual-dev>=1.8.0",
    "trafilatura>=2.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
